#==============================================================================
# INFORMACIÓN DE LA APLICACIÓN
#==============================================================================
spring.application.name=sgpp
# Permite a Flyway ejecutar la migración incluso si la versión del 
# servidor no coincide exactamente con las versiones soportadas.
spring.flyway.validate-on-migrate=false
#puerto del servidor
server.port=8080
#confirmación de la base de datos postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/sgpp_db
spring.datasource.username=sgpp_user
spring.datasource.password=Bpcd1234
spring.datasource.driver-class-name=org.postgresql.Driver
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration, org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

#formatea las consultas sql en la consola
spring.jpa.properties.hibernate.format_sql=true
#desabilita la creación automática de tablas
spring.jpa.hibernate.ddl-auto=none
#las migraciones de Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations

#==============================================================================
# CONFIGURACIÓN DE SWAGGER/OPENAPI
#==============================================================================
# Ruta personalizada para Swagger UI (por defecto: /swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
# Ruta para la especificación OpenAPI en formato JSON
springdoc.api-docs.path=/v3/api-docs
# Habilitar Swagger UI
springdoc.swagger-ui.enabled=true
# Ordenar endpoints alfabéticamente
springdoc.swagger-ui.operationsSorter=alpha
# Ordenar tags alfabéticamente
springdoc.swagger-ui.tagsSorter=alpha
# Intentar automáticamente las peticiones al cargar la página
springdoc.swagger-ui.tryItOutEnabled=true
